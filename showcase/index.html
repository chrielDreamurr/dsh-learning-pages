<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互式学习页 · 能力展示</title>
<style>
:root{
  --bg:#0f1117; --panel:#161a22; --panel2:#1b2029; --bd:#272e3a; --bd2:#333c4b;
  --tx:#e6e9ef; --mut:#98a2b3; --ac:#4f9cf9; --acd:#1e3a5f;
  --ok:#3fb950; --okd:#12331c; --bad:#f85149; --badd:#3a1a18; --warn:#d29922;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.78; display:grid; grid-template-columns:290px 1fr; height:100vh; overflow:hidden;
}

/* ---------- 侧栏 ---------- */
aside{background:var(--panel); border-right:1px solid var(--bd); display:flex; flex-direction:column; overflow:hidden}
.brand{padding:16px 18px 12px; border-bottom:1px solid var(--bd)}
.brand h1{font-size:15px; margin:0 0 4px; letter-spacing:.3px}
.brand p{margin:0; font-size:12px; color:var(--mut)}
.brand .bar{height:5px; background:#0c0f14; border-radius:3px; margin-top:11px; overflow:hidden}
.brand .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--ac),#7c5cff); transition:width .3s}
.brand .pct{font-size:11px; color:var(--mut); margin-top:6px; display:flex; justify-content:space-between}
nav{overflow-y:auto; padding:10px 8px 24px; flex:1}
nav .grp{font-size:11px; color:var(--mut); padding:12px 10px 5px; letter-spacing:.5px; font-weight:600}
nav a{display:flex; gap:9px; align-items:flex-start; padding:7px 10px; border-radius:7px; color:var(--tx);
  text-decoration:none; font-size:13px; line-height:1.5; cursor:pointer; border:1px solid transparent}
nav a:hover{background:#1e232d}
nav a.cur{background:var(--acd); border-color:#2d5c96}
nav a .dot{flex:0 0 15px; height:15px; margin-top:4px; border-radius:50%; border:1.5px solid var(--bd2);
  font-size:9px; display:flex; align-items:center; justify-content:center; color:#0b0e13}
nav a.done .dot{background:var(--ok); border-color:var(--ok)}
nav a.cur .dot{border-color:var(--ac)}
nav a.done span{color:var(--mut)}

/* ---------- 主区 ---------- */
main{display:flex; flex-direction:column; overflow:hidden; min-width:0}
.topbar{display:flex; align-items:center; gap:12px; padding:10px 22px; border-bottom:1px solid var(--bd); background:var(--panel)}
.topbar .chip{font-size:12px; color:var(--mut)}
.topbar .sp{flex:1}
button{font-family:inherit; font-size:13.5px; border-radius:8px; border:1px solid var(--bd2);
  background:var(--panel2); color:var(--tx); padding:8px 16px; cursor:pointer; transition:.15s}
button:hover:not(:disabled){background:#242b36; border-color:#46536a}
button:disabled{opacity:.35; cursor:not-allowed}
button.primary{background:var(--ac); border-color:var(--ac); color:#08111d; font-weight:600}
button.primary:hover:not(:disabled){background:#6aabfb}
button.ghost{background:transparent; border-color:transparent; color:var(--mut); padding:8px 10px}
button.ghost:hover{color:var(--tx); background:#1e232d}
button.tiny{font-size:12px; padding:4px 10px}

.content{overflow-y:auto; padding:34px 44px 60px; flex:1; scroll-behavior:smooth}
.wrap{max-width:850px; margin:0 auto}
.crumb{font-size:12px; color:var(--ac); letter-spacing:.4px; margin-bottom:8px}
h2.title{font-size:24px; margin:0 0 20px; line-height:1.45}
h2.title .tag{font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px; margin-left:10px;
  vertical-align:middle; background:var(--acd); border:1px solid #2d5c96; color:#8fc4ff}
.body p{margin:0 0 14px}
.body ul,.body ol{margin:0 0 14px; padding-left:22px}
.body li{margin-bottom:7px}
.body b,.body strong{color:#fff}
.body code{background:#0c1016; border:1px solid var(--bd); border-radius:5px; padding:1.5px 6px;
  font-family:Consolas,"Cascadia Mono",monospace; font-size:13px; color:#8fd0ff}
pre{background:#0b0f15; border:1px solid var(--bd); border-left:3px solid #38445c;
  border-radius:9px; padding:14px 16px; overflow-x:auto; margin:0 0 16px}
pre code{background:none; border:none; padding:0; color:#cfd8e6; font-size:13px; line-height:1.7}
pre .cm{color:#5f6b7c} pre .kw{color:#c792ea} pre .ok{color:#7ee787} pre .no{color:#ff9d97} pre .hl{color:#ffd479}
table{width:100%; border-collapse:collapse; margin:0 0 16px; font-size:13.5px}
th,td{border:1px solid var(--bd); padding:8px 11px; text-align:left; vertical-align:top}
th{background:#1b2029; color:var(--mut); font-weight:600; font-size:12.5px}
kbd{background:#222a36; border:1px solid var(--bd2); border-bottom-width:2px; border-radius:5px;
  padding:1px 6px; font-size:11.5px; font-family:Consolas,monospace; color:var(--tx)}

/* ---------- 卡片 ---------- */
.callout{border-radius:9px; padding:13px 16px; margin:0 0 16px; font-size:14px; border:1px solid}
.callout .lb{font-weight:700; font-size:12.5px; letter-spacing:.5px; display:block; margin-bottom:5px}
.c-key{background:#12233a; border-color:#274a75}  .c-key .lb{color:#6db3ff}
.c-warn{background:#2b2110; border-color:#5c4a1c} .c-warn .lb{color:#e3b341}
.c-tip{background:#12271a; border-color:#27502f}  .c-tip .lb{color:#5fd07a}
.c-task{background:#1d1730; border-color:#3f3462} .c-task .lb{color:#b18cff}
.c-term{background:#0e2733; border-color:#1f5566} .c-term .lb{color:#4fd1c5}
.term{display:grid; grid-template-columns:130px 1fr; gap:6px 14px; margin:0; font-size:14px}
.term b{color:#4fd1c5; font-weight:600}

/* ---------- 题目卡 ---------- */
.quiz{margin-top:30px; border:1px solid var(--bd2); border-radius:13px; overflow:hidden; background:var(--panel)}
.quiz .qh{padding:14px 20px; background:#1b2029; border-bottom:1px solid var(--bd); display:flex; gap:10px; align-items:baseline}
.quiz .qh .tag{font-size:11px; color:#08111d; background:var(--ac); padding:2px 8px; border-radius:20px; font-weight:700; flex:0 0 auto}
.quiz .qh .tag.sv{background:#8b7cd8}
.quiz .qh .qt{font-weight:600; font-size:15px; line-height:1.6}
.opts{padding:12px 14px 4px}
.opt{display:flex; gap:12px; padding:11px 13px; border:1px solid var(--bd); border-radius:9px; margin-bottom:9px;
  cursor:pointer; transition:.13s; background:#151a22; align-items:flex-start}
.opt:hover{border-color:#46536a; background:#1a202a}
.opt .num{flex:0 0 22px; height:22px; border-radius:6px; background:#222a36; color:var(--mut);
  font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px}
.opt .tx{flex:1; min-width:0}
.opt .lb{font-weight:600; font-size:14px}
.opt .ds{font-size:12.5px; color:var(--mut); margin-top:3px; line-height:1.6}
.opt .why{font-size:13px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--bd2); display:none; line-height:1.72}
.opt.lock{cursor:default}
.opt.lock:hover{border-color:var(--bd); background:#151a22}
.opt.sel-ok{border-color:var(--ok); background:var(--okd)}
.opt.sel-ok .num{background:var(--ok); color:#06180c}
.opt.sel-bad{border-color:var(--bad); background:var(--badd)}
.opt.sel-bad .num{background:var(--bad); color:#2a0c0a}
.opt.reveal{border-color:#2c6b38}
.opt.reveal .num{background:#2c6b38; color:#eafff0}
.opt.answered .why{display:block}
.opt.sel-ok .why{color:#b9f0c6} .opt.sel-bad .why{color:#ffc9c5} .opt.reveal .why{color:#a8e6b8}
.verdict{margin:0 14px 14px; padding:12px 15px; border-radius:9px; font-size:13.5px; display:none; line-height:1.75}
.verdict.on{display:block}
.verdict .lb{font-weight:700; display:block; margin-bottom:4px; font-size:12.5px; letter-spacing:.4px}
.verdict.good{background:var(--okd); border:1px solid #2c6b38} .verdict.good .lb{color:#7ee787}
.verdict.bad{background:var(--badd); border:1px solid #7a2b26} .verdict.bad .lb{color:#ff9d97}
.verdict.info{background:#12233a; border:1px solid #274a75} .verdict.info .lb{color:#6db3ff}
.qfoot{padding:0 14px 14px; display:flex; gap:10px; align-items:center}
.qfoot .hint{font-size:12px; color:var(--mut); flex:1}

/* ---------- 底栏 ---------- */
.footer{border-top:1px solid var(--bd); background:var(--panel); padding:12px 22px; display:flex; gap:10px; align-items:center}
.footer .sp{flex:1}
.footer .pos{font-size:12.5px; color:var(--mut)}

/* ---------- 手机 ---------- */
.menubtn{display:none}
@media(max-width:900px){
  body{grid-template-columns:1fr}
  aside{position:fixed; z-index:50; top:0; bottom:0; left:0; width:290px; transform:translateX(-100%); transition:.2s}
  aside.open{transform:none; box-shadow:0 0 60px #000}
  .menubtn{display:inline-block}
  .content{padding:22px 18px 60px}
  h2.title{font-size:20px}
  .term{grid-template-columns:1fr}
}

</style>
</head>
<body>

<aside id="side">
  <div class="brand">
    <h1>交互式学习页</h1>
    <p>能力展示 · 这一页在演示它自己</p>
    <div class="bar"><i id="pbar"></i></div>
    <div class="pct"><span id="ptxt">进度 0%</span><span id="ptot"></span></div>
  </div>
  <nav id="nav"></nav>
</aside>

<main>
  <div class="topbar">
    <button class="ghost menubtn" onclick="LP.toggleMenu()">☰ 目录</button>
    <span class="chip" id="crumbTop"></span>
    <span class="sp"></span>
    <button class="tiny ghost" onclick="LP.resetAll()">重新开始</button>
  </div>

  <div class="content" id="content"></div>

  <div class="footer">
    <button id="btnPrev" onclick="LP.go(-1)">← 上一题</button>
    <span class="sp"></span>
    <span class="pos" id="pos"></span>
    <span class="sp"></span>
    <button class="primary" id="btnNext" onclick="LP.go(1)">下一题 →</button>
  </div>
</main>

<script>
/* 交互式学习页 · 能力展示
 * ---------------------------------------------------------------------------
 * 这一页本身就是范例：用它自己讲它自己。
 * 内容是按 learning-pages/SPEC.md 的规范写的。
 * 改完内容运行：
 *     node learning-pages/tools/build.js showcase
 *     node learning-pages/tools/validate.js showcase
 * ---------------------------------------------------------------------------
 */
window.PAGE = {
  meta: {
    brand:      "交互式学习页",
    subtitle:   "能力展示 · 这一页在演示它自己",
    docTitle:   "交互式学习页 · 能力展示",
    storageKey: "learning_pages_showcase_v1",
  },

  steps: [

/* ======================= 第 0 章 · 先看这一页 ======================= */
{
  id:'s0-1', ch:'第 0 章 · 先看这一页',
  title:'你现在看的这一页，就是它自己做出来的',
  body:`
  <p>先说清楚：这不是一份写好的文档。</p>
  <p>它是一个<b>会答题、会跳转、记得住你进度的网页</b>。而它是由一份纯内容源生成的——写的人只负责敲文字和题目，页面长什么样、怎么翻页、进度存在哪儿，全部由引擎负责。</p>
  <div class="callout c-key"><span class="lb">这一页没有特殊待遇</span>
  你现在看到的目录、进度条、卡片、题目、分诊跳转，和它给别的主题生成的页面<b>完全一样</b>。<br><br>
  所以「它能做到什么」，你不用听我描述——<b>往下走 20 节，你就在体验它。</b></div>
  <p>全部走完大概 15 分钟。走完你会知道三件事：</p>
  <ol>
    <li><b>它能做什么</b>——六个能力，每个都当场演示给你看</li>
    <li><b>一页是怎么做出来的</b>——内容格式、构建流程、自动检查</li>
    <li><b>哪些坑不能踩</b>——写作规范里那几条硬规矩</li>
  </ol>
  `,
  q:{ type:'quiz', text:'这类页面和一份普通的 Markdown 文档，最大的区别是什么？',
    opts:[
      {label:'它在你读的同时要求你作答，并且立刻解释每个选项——包括你选错的那个为什么错',
       desc:'把「读」变成了「答」',
       correct:true,
       why:'好看、容量大、能离线打开，这些都只是副产品。真正的区别是<b>它不让你划过去</b>：每节末尾必须选一次，选完立刻看到全部选项的解释。<br><br>读文档时人很容易产生「我懂了」的错觉；答题时这个错觉会当场破掉。而错的那一项得到解释的那一刻，才是真正在学习。'},
      {label:'它更好看', desc:'版式更精美',
       why:'版式确实更讲究，但那是结果不是目的。如果只是想做一份漂亮文档，用排版工具更快——不需要为每一节写题。'},
      {label:'它能放的内容更多', desc:'信息量更大',
       why:'恰恰相反。同样的主题，这个形式往往<b>内容更少</b>——因为每节都要配题，写的人会不自觉地把一节讲透，而不是堆砌。'},
      {label:'它不需要联网', desc:'可离线',
       why:'这算一个优点（产物确实零外部依赖），但普通 Markdown 也能离线看。它回答不了「为什么值得为每一节写一道题」这个问题。'}
    ],
    summary:'它把被动阅读变成主动作答。答题和即时解释，是这一整套东西存在的理由。'
  }
},

{
  id:'s0-2', ch:'第 0 章 · 先看这一页',
  title:'它和「一份文档」到底差在哪',
  body:`
  <p>把差别说得可检验一点，是这三条：</p>
  <table>
    <tr><th style="width:130px">差别</th><th>普通文档</th><th>这个范式</th></tr>
    <tr><td><b>是否强制输出</b></td><td>可以从头划到尾，一个字不写</td><td>每一节末尾必须选一次，不选也能翻，但那一节不会打勾</td></tr>
    <tr><td><b>反馈方式</b></td><td>写完再看，或者根本不知道对不对</td><td>选完立刻展开<b>每个选项</b>的解释，包括没选的那些</td></tr>
    <tr><td><b>起点</b></td><td>所有人从第一页开始</td><td><b>分诊</b>：先问你的情况，把你送到合适的起点</td></tr>
  </table>
  <p>第三点最容易被忽略。「零基础」和「有点基础」的人需要的第一页根本不是同一页：前者需要把术语解释清楚，后者只想直接看重点。让前者从后者那一页开始，他会懵；让后者从前者的那一页开始，他会走。</p>
  <div class="callout c-tip"><span class="lb">一个可以马上试的实验</span>
  这一页的<b>第 0 章第三题</b>就是一个分诊题。它就是靠第三点的机制，把不同的人送到第 1 章、第 2 章或第 4 章。<br><br>你可以故意选一个不是你的选项，看它跳到哪儿去。</div>
  `,
  q:{ type:'quiz', text:'为什么「立刻解释每个选项」比「只告诉你对错」更有用？',
    opts:[
      {label:'因为答错的那一刻，正是人最想知道「我到底哪儿想错了」的时候', desc:'时机决定效果',
       correct:true,
       why:'学习动机是有窗口期的。答错后三秒内看到解释，人会认真读；等翻到章末对答案，那股「咦我错哪了」的劲头早没了。<br><br>而且解释的对象要包括<b>你没选的那些</b>——那里面藏着你下次会犯的错。'},
      {label:'因为这样页面内容更丰富', desc:'信息量',
       why:'解释确实是信息，但信息量本身不是价值。一份把所有解释堆在文末的文档，信息一样多，只是你多半不会去翻。'},
      {label:'因为可以反复看，加深记忆', desc:'可重复',
       why:'能反复看是形式上的好处。真正起作用的是<b>第一次看到它的时机</b>——在你刚答错、注意力最高的时候。'},
      {label:'因为这样显得更专业', desc:'观感',
       why:'这是设计的结果，不是设计的目的。只盯着观感，很容易做出「解释写得很长但没答到点上」的页面。'}
    ],
    summary:'反馈的价值在时机。答错后立刻解释，效果远好于文末统一对答案。'
  }
},

{
  id:'s0-3', ch:'第 0 章 · 先看这一页',
  title:'你想怎么看这一页？',
  body:`
  <p>下面这题没有对错，它是<b>分诊题</b>——选完点「继续」，会直接把你送到合适的起点。</p>
  <div class="callout c-term"><span class="lb">术语卡 · 分诊</span>
  医院里先分科的意思。<b>放到这里就是：不问「大家都从哪开始」，而是问你从哪开始。</b><br><br>
  实现上很简单——给选项加一个 <code>next</code> 字段，选它并点继续时，页面就跳到那一节。</div>
  `,
  q:{ type:'survey', text:'你现在是什么情况？',
    opts:[
      {label:'我只想看看它能做成什么样', desc:'直接进第 1 章，六个能力挨个试一遍', next:'s1-1'},
      {label:'我想自己做一页', desc:'跳到第 2 章：内容格式和制作流程', next:'s2-1'},
      {label:'我已经懂了，想马上开始用', desc:'跳到第 4 章：三步上手', next:'s4-1'},
      {label:'我按顺序从头看到尾', desc:'最完整，也最花时间', next:'s1-1'}
    ],
    summary:'随时可以用左侧目录跳到别处，进度会一直记着。'
  }
},

/* ======================= 第 1 章 · 六个能力 ======================= */
{
  id:'s1-1', ch:'第 1 章 · 六个能力，边看边试',
  title:'能力一：选完立刻解释，连错的都解释',
  body:`
  <p>这是最基础的能力，你刚才已经用过两次了。完整的样子是这样：</p>
  <ul>
    <li>你选的那项——<b>对了标绿，错了标红</b></li>
    <li>正确答案——<b>无论你选没选，都会以绿色展开</b>，所以你不至于答错了还不知道答案</li>
    <li><b>每个选项的解释</b>同时展开，包括你没选的那些</li>
    <li>答错了会提示「可以重答本题」，重答不计成绩</li>
  </ul>
  <div class="callout c-key"><span class="lb">关键不在解释，在于「错误选项是怎么来的」</span>
  一个选择题好不好，八成取决于<b>错误选项</b>。<br><br>
  凑数的选项（「显然是 A」「和题目无关」这种一眼能排除的）等于浪费一次教学机会。<b>好的错误选项是读者第一直觉会选的那个</b>——他栽在这儿，才知道自己哪儿想错了。<br><br>这一整套规范里，「错误选项必须是真实存在的误解」是执行得最严的一条。</div>
  `,
  q:{ type:'quiz', text:'一页做完之后要改内容，你应该改哪个文件？',
    opts:[
      {label:'改 <code>content.js</code>，然后重新构建', desc:'源文件才是唯一的真相',
       correct:true,
       why:'<code>content.js</code> 是内容源，<code>index.html</code> 是它构建出来的产物。<b>只改源、再构建</b>，两边就永远一致。<br><br>这条规矩看着啰嗦，但它是后面所有自动化检查（校验、重建、批量更新）能成立的前提——如果产物可以被手改，检查就失去意义了。'},
      {label:'改 <code>index.html</code>，反正浏览器打开的是它', desc:'直接改看得见的那个',
       why:'手改产物<b>当场有效、下次构建就被覆盖</b>。更麻烦的是：改完之后你以为源和产物是一致的，实际上不是——等你哪天重新构建，改动就神不知鬼不觉地消失了。<br><br>这种「改了但没了」的 bug 特别难查，因为它的症状是「我明明改过啊」。'},
      {label:'两个都改，保险一点', desc:'双保险',
       why:'两边都改反而是最坏的做法：你无法判断哪边是新的。<b>单一真相来源</b>的价值就在于，任何时候都不需要问「以哪个为准」。'},
      {label:'改引擎 <code>engine.js</code>，让它读我的新内容', desc:'从底层解决',
       why:'<code>engine.js</code> 是所有页面共用的渲染引擎，它不认识你的具体内容。改它等于为了一个页面的内容去动全站的地基——很可能把其他页面弄坏。'}
    ],
    summary:'只改源文件，产物永远靠构建生成。这条规矩是后面所有自动检查能成立的前提。'
  }
},

{
  id:'s1-2', ch:'第 1 章 · 六个能力，边看边试',
  title:'能力二：把专业词翻译成人话',
  body:`
  <p>你在这一页里已经见过好几张<b>青色的术语卡</b>了。它的作用是：每个专业名词第一次出现，就地解释，而且<b>先用生活里的东西打比方</b>。</p>
  <table>
    <tr><th style="width:150px">术语</th><th>这一整套东西里用的比喻</th></tr>
    <tr><td>分诊</td><td>医院里先分科</td></tr>
    <tr><td>校验器（见第 2 章）</td><td>交付前的质检员</td></tr>
    <tr><td>单一真相来源（见第 2 章）</td><td>只认一个账本</td></tr>
  </table>
  <div class="callout c-warn"><span class="lb">小心坑：不要用术语解释术语</span>
  「正交分解就是把向量投影到基向量上」——这句话对已经懂的人毫无信息量，对不懂的人还是一堵墙。<br><br>
  <b>规则是：解释一个词的时候，只能用比它更简单的词。</b>如果实在绕不开另一个术语，就先把那个也解释掉。</div>
  <div class="callout c-tip"><span class="lb">小技巧：比喻要挑「读者每天都碰得到」的</span>
  「就像 CPU 的流水线」——读者没见过流水线。「就像你在食堂排队，前面的人打完菜你才能往前走」——这个人人有体感。<br><br>找比喻的时候问自己一句：<b>他今天早上碰到过这个东西吗？</b></div>
  `,
  q:{ type:'quiz', text:'下面哪一句最符合「术语卡」的写法要求？',
    opts:[
      {label:'「中断：你在写作业，手机响了，你接完电话回来接着写——CPU 被打断去处理别的事，处理完回到原处继续。」',
       desc:'先给生活场景，再给定义',
       correct:true,
       why:'它做对了两件事：<b>先给一个人人有体感的场景</b>（写作业时接电话），<b>再落到技术定义</b>上（CPU 被打断、处理完回到原处）。读者拿到的是「我知道这是什么感觉」，而不只是「我背下了一句话」。'},
      {label:'「中断是 CPU 响应外部事件而暂停当前指令流、转去执行中断服务程序的机制。」',
       desc:'标准教科书定义',
       why:'定义是准确的，但对零基础读者几乎零信息量——「指令流」「中断服务程序」这两个词他同样不懂。这段话只适合已经懂的人做复习。'},
      {label:'「中断，即 interrupt，简称 IRQ。」', desc:'中英对照',
       why:'给了缩写和英文，没给任何理解上的抓手。读者记住的只是一个更短的字符串。'},
      {label:'「中断非常重要，是嵌入式开发的核心概念之一。」', desc:'强调重要性',
       why:'这是在说「它很重要」，不是在解释「它是什么」。读者读完仍然不知道中断是什么——这类句子在教材里很多，但基本没用。'}

},

{
  id:'s1-3', ch:'第 1 章 · 六个能力，边看边试',
  title:'能力三：按你的情况送到不同起点',
  body:`
  <p>你已经用过一次了——第 0 章第三题。这一节把它讲清楚，因为它是这个范式里<b>最容易被做砸</b>的一个功能。</p>
  <p>机制上很简单：给选项加一个 <code>next</code> 字段填目标节的 <code>id</code>，读者选它并点「继续」，就跳过去。</p>
  <p>难的是<b>分诊点设在哪</b>。经验是三个位置：</p>
  <table>
    <tr><th style="width:150px">位置</th><th>问什么</th></tr>
    <tr><td>开头</td><td>你的水平和目标是什么？（送到不同起点）</td></tr>
    <tr><td>讲完一个能力后</td><td>你刚才那步做出来了吗？（没做出来 → 跳回对应那一节）</td></tr>
    <tr><td>章末</td><td>你遇到的现象是哪种？（故障分诊，跳到对应的排查方法）</td></tr>
  </table>
  <div class="callout c-tip"><span class="lb">小技巧：分诊题的分支要指向「下一步该做什么」，不是「你已经懂了什么」</span>
  坏的问法：「你对这个概念理解到什么程度了？」——读者多半会高估自己。<br>
  好的问法：「你刚才那一步做出来了吗？灯泡亮了吗？」——这是可观察的事实，猜不了。</div>
  `,
  q:{ type:'quiz', text:'为什么分诊题要问「你板子上的灯亮了吗」，而不是「你理解 GPIO 了吗」？',
    opts:[
      {label:'因为「灯亮了吗」是可观察的事实，读者没法高估自己；「理解了吗」只能靠自评，通常会高估',
       desc:'问事实，不问感觉',
       correct:true,
       why:'人对自己的理解程度判断得相当不准——刚看完一段顺畅的解释，几乎所有人都会觉得「懂了」，一动手才发现不是。<br><br>所以分诊要问<b>已经发生的事实</b>：灯亮了吗？编译报错了吗？按下按钮有反应吗？这些答案猜不了，分诊才准。'},
      {label:'因为问技术细节显得更专业', desc:'观感',
       why:'专业感不是目的。而且「灯亮了吗」恰恰是个很土的问题——它之所以好，是因为答案客观。'},
      {label:'因为这样能给读者一个动手的目标', desc:'激励作用',
       why:'有一点这个作用，但那是顺带的。核心是<b>分诊的准确性</b>依赖答案的可信度。'},
      {label:'因为初学者答不上来抽象问题', desc:'照顾初学者',
       why:'方向反了——即使对有基础的人，「你理解了吗」同样不可靠。任何水平的自评都不如一个可观察的结果。'}
    ],
    summary:'分诊要问已经发生的、可观察的事实。问感受必然失真。'
  }
},

{
  id:'s1-4', ch:'第 1 章 · 六个能力，边看边试',
  title:'能力四：进度记在本地，关掉再开还在',
  body:`
  <p>你大概已经注意到了：左侧目录里走过的节打了勾，右上角有进度条和「答对 x/y」。<b>这些东西存在你自己的浏览器里</b>，关掉标签页、甚至关机重开，再打开这一页进度都还在。</p>
  <p>存储用的键是内容里写死的 <code>storageKey</code>（这一页是 <code>learning_pages_showcase_v1</code>）。</p>
  <div class="callout c-warn"><span class="lb">小心坑：改了内容却忘了改 storageKey，读者的进度会错位</span>
  存档里记的是「第几题选了第几项」。<br><br>
  如果你后来<b>增删了题目、或者调整了某个题目的选项顺序</b>，那个编号指向的就不是原来那一项了——读者会看到自己明明选对了却被标成错的。<br><br>
  <b>规矩：内容大改之后，把 <code>storageKey</code> 末尾的版本号 +1。</b>代价是所有人的进度重置一次，但换来的是不会再出现莫名其妙的错位。</div>
  <div class="callout c-tip"><span class="lb">小技巧：不想让答案位置影响进度，可以让选项顺序固定</span>
  这一整套东西默认会<b>按节的 id 确定性地打乱选项顺序</b>（下一节讲为什么）。因为打乱规则由 id 决定，所以同一份内容每次打开顺序都一样，进度不会错位——<b>但你要是改了那一节的 id，顺序就变了，等于换了题</b>。</div>
  `,
  q:{ type:'quiz', text:'你给某一节多加了一道题，然后把内容重新构建上线了。最可能出什么问题？',
    opts:[
      {label:'已读过的人的进度会错位——旧存档里的编号指向了别的选项',
       desc:'存档键没换版本',
       correct:true,
       why:'存档记录的是「第几题 / 第几项」这种位置编号，不是内容和选项本身。插入、删除、重排任何一题，后面所有编号都会平移一位，读者会看到自己「答错了」其实没答错的题。<br><br>解法就是把 <code>storageKey</code> 的版本号 +1，让大家重新开始。'},
      {label:'旧读者会看到新加的那道题，其他一切正常', desc:'新题自动出现',
       why:'新题确实会出现，但问题不在新题本身——在于<b>它后面所有题的位置都变了</b>，而旧存档是按老位置记的。'},
      {label:'页面会报错打不开', desc:'运行错误',
       why:'不会。构建、校验、打开都正常，所有校验项都能通过——这是一个<b>只在老读者身上、且只在特定题目上显现</b>的静默问题，所以更麻烦。'},
      {label:'浏览器会拒绝写入存档', desc:'存储失败',
       why:'存储本身没问题，就是写进去了、也能读出来，只是读出来的编号对应到别的题上了。'}
    ],
    summary:'存档按位置编号，任何增删和重排都会让旧进度错位。内容大改就换 storageKey 版本号。'
  }
},

{
  id:'s1-5', ch:'第 1 章 · 六个能力，边看边试',
  title:'能力五：五种卡片，各管一件事',
  body:`
  <p>页面上的彩色方块不是装饰，是<b>视觉锚点</b>。这一页里你已经见过全部五种了：</p>
  <table>
    <tr><th style="width:130px">卡片</th><th style="width:70px">颜色</th><th>放什么</th><th style="width:120px">频率</th></tr>
    <tr><td><b>术语卡</b></td><td style="color:#4fd1c5">青</td><td>解释一个专业词：比喻 + 一句话定义</td><td>每节 0~2 个，最常用</td></tr>
    <tr><td><b>划重点</b></td><td style="color:#6db3ff">蓝</td><td>本节最核心的那一句话</td><td><b>每节最多 1 个</b></td></tr>
    <tr><td><b>小心坑</b></td><td style="color:#e3b341">黄</td><td>新手最容易翻车的地方：现象 + 原因 + 怎么避开</td><td>有坑才写</td></tr>
    <tr><td><b>小技巧</b></td><td style="color:#5fd07a">绿</td><td>能省时间或提高正确率的经验</td><td>有才写</td></tr>
    <tr><td><b>动手任务</b></td><td style="color:#b18cff">紫</td><td>看完之后具体去做什么</td><td>放在章节收尾</td></tr>
  </table>
  <div class="callout c-warn"><span class="lb">小心坑：卡片堆多了等于没有卡片</span>
  一节里如果五种卡片各来三个，读者的视觉系统会直接把它们屏蔽掉——满屏都是重点，就等于没有重点。<br><br>
  所以有一条硬规矩：<b>「划重点」每节最多一个。</b>选不出来哪个最重要，说明这一节该拆成两节。</div>
  <div class="callout c-tip"><span class="lb">小技巧：卡片数量可以当作自检信号</span>
  写完一节回头数一下：蓝色 0 个 → 这一节没有中心句，读者记不住；蓝色 2 个以上 → 这节想说的太多，该拆。<br><br>黄色和绿色都为 0 也很可疑——要么这节内容太浅，要么你写得太顺、没想到读者会在哪儿卡住。</div>
  `,
  q:{ type:'quiz', text:'一节里出现了三个「划重点」蓝色卡片，最应该怎么处理？',
    opts:[
      {label:'说明这一节其实想说三件事，应该拆成三节——或者选出真正最重要的一个',
       desc:'卡片数量是结构信号',
       correct:true,
       why:'「重点」这个词本身就意味着排他性：如果三个都重要，那就不存在重点。<br><br>而且这个问题很少是「卡片多了」这么简单——<b>它暴露的是这一节承载了太多内容</b>。拆节通常比删卡片更对，因为那三件事本来就不该挤在一起。'},
      {label:'没事，读者自己会判断哪个重要', desc:'交给读者',
       why:'读者的注意力是有限资源，标三个重点等于让他自己做筛选——那他为什么还需要你标？'},
      {label:'把三个合并成一个更长的卡片', desc:'换个形式',
       why:'形式变了，问题没变：一节里仍然有三个并列的「最重要的事」，读者仍然不知道该记住哪个。'},
      {label:'改成用一个「小心坑」加两个「小技巧」', desc:'换个颜色',
       why:'这是把问题藏起来。真正该问的是：这三句话里哪一句是这一节的<b>中心</b>？剩下两句是补充还是别的主题？'}
    ],
    summary:'「划重点」每节最多一个。标不出来，就说明这节该拆。'
  }
},

{
  id:'s1-6', ch:'第 1 章 · 六个能力，边看边试',
  title:'能力六：出题有规矩，选项顺序会打乱',
  body:`
  <p>最后一个能力，是这整套东西里最不显眼、但影响最大的一个：<b>选项顺序由引擎自动打乱。</b></p>
  <p>你可能会想：为什么要打乱？</p>
  <div class="callout c-key"><span class="lb">因为写的人会不自觉地把正确答案放在第一个</span>
  这不是猜测。这一整套东西第一次全量校验的时候，<b>83 道题里绝大多数正确答案都在第 1 项</b>——写的时候完全没意识到。<br><br>
  后果很实在：读者做过十来道之后，会形成「先看第一个」的肌肉记忆，题目就失去了检验作用。<b>自动打乱把这个问题从「靠自觉」变成了「靠机制」。</b></div>
  <p>两个实现细节值得说：</p>
  <ul>
    <li><b>确定性。</b>打乱的规则由这一节的 <code>id</code> 算哈希决定，所以同一份内容<b>每次构建、每次刷新，顺序都完全一样</b>。不会出现「刷新一下选项全变了」这种让人怀疑自己点错了的情况。</li>
    <li><b>只打乱选择题。</b>分诊题（就是刚才那种没有对错的）<b>保持原样</b>——它的选项顺序本身有含义，打乱就乱了。</li>
  </ul>
  <div class="callout c-warn"><span class="lb">小心坑：确实需要固定顺序的题目</span>
  如果某道题的选项有天然次序（比如「由小到大列出四种复杂度」），打乱反而会让题目变得别扭。这时候可以给这一题加 <code>keepOrder: true</code> 跳过打乱。</div>
  `,
  q:{ type:'quiz', text:'为什么选项打乱必须是「确定性」的，而不是每次刷新随机？',
    opts:[
      {label:'因为如果每次刷新顺序都变，读者会怀疑自己点错了；而且确定性让同一份内容的呈现始终一致',
       desc:'打乱是为了防惯性，不是为了随机',
       correct:true,
       why:'打乱的目的只有一个：<b>让正确答案的位置不可预测</b>，从而防止读者形成「总是选第一个」的习惯。<br><br>这个目的<b>只需要位置分布均匀就够了</b>，不需要每次都变。而每次刷新都变反而有害：读者会以为是自己点错了、或者页面出问题了。更实际的是，开发时你每次刷新看到的顺序都不一样，很难调试。'},
      {label:'因为随机数会拖慢页面', desc:'性能',
       why:'生成随机数在这个量级上完全不影响性能。这是设计取向问题，不是性能问题。'},
      {label:'因为要做本地进度存档，随机的话存档会失效', desc:'存档需要',
       why:'存档记的是「选了第几项」，跟选项顺序是不是随机无关——真正会导致错位的是<b>内容变更</b>（上一节讲的 storageKey 问题）。<br><br>不过这个选项点到了一个真实的关联：如果顺序每次刷新都变，那么你在第 3 节选的「第 2 项」下次打开时指向的就是别的内容了——这确实会毁掉存档。但那是<b>顺带的好处</b>，不是选择确定性的理由。'},
      {label:'因为浏览器不支持真随机', desc:'技术限制',
       why:'浏览器完全支持随机数，生成一个随机排列只要一行代码。<b>这是主动的设计选择，不是被技术条件逼出来的</b>——所以理由必须从「这样对读者更好」里找，而不是「只能这么办」。'}
    ],
    summary:'打乱只要位置分布均匀就够了，不需要每次刷新都变。确定性让呈现稳定、存档可靠、调试可行。'
  }
},

/* ======================= 第 2 章 · 一页怎么做出来 ======================= */
{
  id:'s2-1', ch:'第 2 章 · 一页是怎么做出来的',
  title:'一个页面 = 两份文件',
  body:`
  <p>制作流程剥到最简，就一句话：<b>你写一份内容源，构建出一个网页。</b></p>
  <pre><code>mytopic/
├─ content.js     <span class="cm">← 你唯一要写的文件：文字 + 题目</span>
└─ index.html     <span class="hl">← 构建产物：别手改，随时可以重新生成</span></code></pre>
  <div class="callout c-term"><span class="lb">术语卡 · 单一真相来源</span>
  一件事只记在一个地方，别处都是它的副本。<b>就像只认一个账本</b>——如果同时记两本，早晚会对不上，而且你不知道该信哪本。<br><br>
  在这里：内容是 <code>content.js</code>，网页是它的副本。</div>
  <div class="callout c-key"><span class="lb">产物是「单文件」的，这一点很重要</span>
  引擎、样式、内容<b>全部内联进那一个 <code>index.html</code></b>（150~200 KB）。<br><br>
  带来三个实在的好处：<br>
  ① <b>零外部依赖</b>——不会因为某个 CDN 挂掉而白屏；<br>
  ② <b>可离线</b>——拷到 U 盘、发到群里都能直接打开；<br>
  ③ <b>可单独发给别人</b>——不用打包一个文件夹，就一个文件。</div>
  <p>另外还有一个不成文的约定：<b>页面目录直接放在工作区根目录下</b>，和工具目录并列。工具扫描的是工作区根的直接子目录，藏太深它就找不到了。</p>
  `,
  q:{ type:'quiz', text:'把产物做成「单个自包含的 HTML 文件」，最大的好处是什么？',
    opts:[
      {label:'可以直接发给别人、可以离线打开，也不会因为外部资源加载失败而白屏',
       desc:'零依赖、可分发',
       correct:true,
       why:'嵌入式、实验室、教室里经常是没网或者网很差的环境。单文件意味着<b>「能打开」这件事不依赖任何别的东西</b>。<br><br>代价是文件偏大（150~200 KB）而且引擎被复制进了每一页——但对这个体量来说，这个代价换来的可靠性非常划算。'},
      {label:'因为浏览器不支持加载外部 JS', desc:'技术限制',
       why:'浏览器当然支持加载外部脚本和样式，绝大多数网页就是这么做的。这是主动选的，不是被迫的。'},
      {label:'因为这样页面打开更快', desc:'性能',
       why:'单文件少了几次网络请求，本地打开确实略快——但 150 KB 放在本地，快慢的差别你感觉不到。这也不是选它的理由。'},
      {label:'因为这样更容易做版本管理', desc:'便于管理',
       why:'恰恰相反：产物里混着引擎和内容，看 diff 时会很乱。<b>方便管理的是「源和产物分开」这件事本身</b>，跟产物是不是单文件无关。'}
    ],
    summary:'单文件产物换来的核心价值是「打开不依赖任何别的东西」。'
  }
},

{
  id:'s2-2', ch:'第 2 章 · 一页是怎么做出来的',
  title:'一节内容长什么样',
  body:`
  <p>整页就是一个「节」的数组。每一节长这样：</p>

  ch:   '第 1 章 · 基础概念',        <span class="cm">// 相同 ch 且相邻 = 侧栏一个分组</span>
  title:'变量：贴了标签的盒子',       <span class="cm">// 目录和正文标题共用</span>
  body: <span class="hl">这一节的正文（HTML）</span>,          <span class="cm">// 卡片、表格、代码都在这里</span>
  q:    { … }                      <span class="cm">// 选填，但强烈建议每节都有</span>
}</code></pre>
  <p>题目对象是这样的：</p>
  <pre><code>q: {
  type: 'quiz',                    <span class="cm">// quiz 有对错 / survey 只是分诊或自评</span>
  text: '题面，要具体、可回答',
  opts: [
    { label:'选项标题', desc:'副标题（灰字）',
      correct:true,                <span class="cm">// 仅 quiz 用，且必须恰好一项为 true</span>
      why:'选了之后展开的解释',
      next:'s1-1' },               <span class="cm">// 选填：选它并点继续时跳到这一节</span>

}</code></pre>
  <div class="callout c-key"><span class="lb">两种题型分工明确</span>
  <b>quiz</b>：有对错，恰好一个正确答案，<b>每个选项都必须写解释</b>。用于检验理解。<br>
  <b>survey</b>：没有对错，<b>不打乱选项</b>。用于分诊跳转、自我确认、收尾。<br><br>

  `,
  q:{ type:'quiz', text:'一道 <code>quiz</code> 题有四个选项，应该有几个标 <code>correct: true</code>？',

      {label:'一个或多个都行，看题目', desc:'灵活处理',
       why:'多个正确答案会让「答对/答错」失去意义，成绩统计也就没有依据了。<b>如果确实有两个说法都成立，应该改题面，让它只留一个最贴切的。</b>'},
      {label:'不需要标，靠解释文字让读者自己判断', desc:'不标正确答案',
       why:'那样读者永远不知道自己答对没有，也就失去了即时反馈这个核心价值。而且「重答本题」「答对 x/y」这些功能都需要一个客观答案。'},
      {label:'每题数量不限，系统会自动取第一个 <code>correct:true</code>', desc:'自动取第一个',
       why:'引擎不会猜你的意图。校验器就是按「恰好一个」来检查的，多标一个会直接构建报错。'}

{
  id:'s2-3', ch:'第 2 章 · 一页是怎么做出来的',
  title:'出题的四条规矩',
  body:`
  <p>内容规范里最花笔墨的就是出题。四条，按重要性排：</p>
  <table>
    <tr><th style="width:30px">#</th><th style="width:190px">规矩</th><th>为什么</th></tr>
    <tr><td>1</td><td><b>错误选项必须是真实存在的误解</b></td><td>凑数的选项一眼被排除，等于浪费一次教学机会。好的错误选项是读者第一直觉会选的那个。</td></tr>
    <tr><td>2</td><td><b>解释要指出「哪里想错了」</b></td><td>不是复述正确答案。「你说的这个在什么情况下才成立」比「正确答案是 B」有用十倍。</td></tr>
    <tr><td>3</td><td><b>题面要具体、可回答</b></td><td>好：「7 除以 2 等于几？」；坏：「你理解整数除法了吗？」</td></tr>
    <tr><td>4</td><td><b>考理解，不考记忆</b></td><td>好：「为什么这样写会出错？」；坏：「刚才那个函数叫什么名字？」</td></tr>
  </table>
  <div class="callout c-warn"><span class="lb">小心坑：解释写成「因为 A 是对的」</span>
  这是最常见的敷衍写法——<b>它只是把选项标签重念了一遍，没有增加任何信息</b>。<br><br>
  读者选错之后想知道的是：我为什么会这么想？我这个想法在哪儿不成立？正确答案为什么能成立？<b>这三个问题，一个都不能靠重复答案来回答。</b></div>
  <div class="callout c-tip"><span class="lb">小技巧：先写错误选项，再写正确答案</span>
  按「正确答案 → 凑三个错的」这个顺序写，错误选项必然敷衍。<br><br>
  反过来：<b>先列出现在最可能犯的三种错，再写一个能同时把它们区分开的正确答案</b>——这样写出来的题，往往比先想答案的题更有检验力。</div>
  `,
  q:{ type:'quiz', text:'下面哪个「错误选项的解释」写得最好？',
    opts:[
      {label:'「你说的这个在什么情况下才成立？——只有当数据已经排好序时。而题目里的数据是乱序的，所以这个方法不成立。」',
       desc:'指出成立条件，再说明为什么不满足',
       correct:true,
       why:'它做了最有用的那件事：<b>承认这个误解有它的道理</b>，然后精确指出它成立的前提条件，最后说明题目为什么不满足这个条件。<br><br>读者读完不仅知道「我错了」，还知道「我什么时候是对的」——这个边界感比单纯的正确答案有价值得多。'},
      {label:'「不正确，正确答案是 B。」', desc:'只给结论',
       why:'没有增加任何信息。读者读完仍然不知道自己的思路错在哪，下次还会犯同样的错。'},
      {label:'「这个选项是错的。」', desc:'一句话带过',
       why:'连正确答案都没告诉读者，他既不知道自己错在哪，也无从核对。<b>这种解释约等于没写</b>——它甚至比「不正确，答案是 B」还差，因为那至少给了答案。'},
      {label:'「这个想法很常见，很多人都这么选。」', desc:'安慰式解释',
       why:'安抚作用有一点，但<b>没有回答「为什么错」</b>。而且「很多人都这么选」反而可能让读者更坚信自己没错——毕竟大家都这么想。'}
    ],
    summary:'好的解释会指出「你的想法在什么条件下才成立」，而不是只宣布它错了。'
  }
},

{
  id:'s2-4', ch:'第 2 章 · 一页是怎么做出来的',
  title:'构建与校验：写完之后的两个命令',
  body:`
  <p>写完内容，跑两条命令：</p>
  <pre><code><span class="cm"># 把 content.js 构建成 index.html</span>
node learning-pages/tools/build.js showcase

<span class="cm"># 检查内容有没有问题</span>
node learning-pages/tools/validate.js showcase</code></pre>
  <div class="callout c-term"><span class="lb">术语卡 · 校验器</span>
  交付前先过一遍的<b>质检员</b>。它不判断你写得好不好，只检查<b>结构上有没有硬伤</b>——比如有没有漏填的字段、指向不存在的跳转目标、标签没闭合。<br><br>
  关键区别：它<b>不是读一遍你的文字，而是真的把每一节、每一个选项渲染一遍</b>。</div>
  <p>它检查这些东西：</p>
  <table>
    <tr><th style="width:230px">检查项</th><th>抓什么</th></tr>
    <tr><td>id 唯一、章节连续</td><td>同一个章节名中间插了别的章节 → 侧栏会出现两个同名分组</td></tr>
    <tr><td>quiz 恰好一个正确答案</td><td>0 个或 2 个以上</td></tr>
    <tr><td>每个选项都有解释</td><td>漏写 <code>why</code></td></tr>
    <tr><td><code>next</code> 指向真实存在的节</td><td>打错 id、或者在删节之后忘了改</td></tr>
    <tr><td><b>模拟点击验证跳转</b></td><td>不只是检查 id 存在，而是真的「选这一项 → 点继续 → 看落到哪一节」</td></tr>

  <div class="callout c-key"><span class="lb">错误必须清零，提示要有交代</span>
  校验结果分两档：<b>错误</b>（结构硬伤，必须修）和<b>提示</b>（可疑但未必错，比如解释写得太短）。<br><br>
  规矩是：<b>错误清零；提示要么修掉，要么能说出为什么保留。</b>不能因为「它只是提示」就一路忽略过去。</div>
  `,
  q:{ type:'quiz', text:'校验器说「第 12 节的 <code>next</code> 指向不存在的 id <code>s3-9</code>」，这是什么问题？',

      {label:'那一节的分诊跳转坏了——读者选了那个选项、点继续，会跳不过去或跳到错误的位置',
       desc:'跳转目标失效',
       correct:true,
       why:'<code>next</code> 靠 id 引用目标节。id 写错、或者你删掉了被指向的那一节却没改引用，跳转就失效了。<br><br>这类问题<b>在页面上不容易发现</b>——你得正好走到那一节、正好选那个选项、正好点继续，才会撞上。所以必须靠校验器提前抓。'},
      {label:'页面会直接崩溃打不开', desc:'致命错误',
       why:'不会崩。引擎遇到无效的 <code>next</code> 时会退化成普通翻页——所以这是个<b>静默降级</b>的问题，读者只会觉得「这里怎么没跳」，你则完全不知道。'},
      {label:'只是命名不规范，不影响功能', desc:'风格问题',
       why:'命名规范是另一回事。这条报的是<b>引用完整性</b>：目标不存在，功能就是坏的。'},
      {label:'说明这一节忘了写题目', desc:'缺题',
       why:'缺题有单独的提示。这条报的是跳转目标的问题——即使这一节有题，只要它的 <code>next</code> 指错了，照样报。'}
    ],
    summary:'next 是引用，引用必须真实存在。跳转失效是静默的，只能靠校验器提前发现。'

{
  id:'s2-5', ch:'第 2 章 · 一页是怎么做出来的',
  title:'校验器实际抓到过什么',
  body:`
  <p>上面那段是功能列表，读起来挺无聊的。讲两个它<b>真的抓到过</b>的问题，你就知道它值不值。</p>
  <div class="callout c-warn"><span class="lb">案例一：83 道题，正确答案几乎全在第 1 项</span>
  第一份内容写完之后跑全量校验，分布统计报出一条提示：正确答案的位置严重偏斜。<br><br>
  写的时候完全没意识到——每一题都是「先写对的那个，再补三个错的」。单看一题毫无问题，<b>放到 83 道题的尺度上就变成了一个系统性缺陷</b>：读者做过十来道就会形成「闭眼选第一个」的习惯，题目全部失去检验作用。<br><br>
  修法不是回头一题一题改（那是治标），而是<b>把打乱做进引擎</b>（上一章讲的能力六）。现在分布是这样的：<br>
  <code>38 题 → 1项:8  2项:9  3项:10  4项:11</code></div>
  <div class="callout c-warn"><span class="lb">案例二：4 处 HTML 标签没配对</span>
  另一份内容里有 4 个地方 <code>&lt;p&gt;</code> 或 <code>&lt;div&gt;</code> 没闭合。<br><br>
  浏览器对这类错误<b>非常宽容</b>——它会自己猜你的意思，页面看起来一切正常。所以人工检查几乎发现不了。<br><br>
  但它会静默地改变结构：一个没闭合的 <code>&lt;p&gt;</code> 会把后面的内容吞进去，等到某天你往里加东西，样式就莫名其妙地跑偏了。<b>这种「现在没事、以后出事」的问题，正是自动检查最有价值的地方。</b></div>
  <div class="callout c-key"><span class="lb">这两个案例的共同点</span>
  它们都<b>不是语法错误，而是尺度上的问题</b>：<br>
  一个是「单题没问题，83 题就有问题」；<br>
  一个是「浏览器不报错，但结构已经错了」。<br><br>
  <b>人眼擅长度量单点，不擅长度量整体。</b>这就是要把检查写成程序的原因——不是因为人不够仔细，是因为有些问题根本不在「仔细」能覆盖的范围内。</div>
  `,
  q:{ type:'quiz', text:'为什么「浏览器不报错的标签错误」值得专门写程序去检查？',
    opts:[
      {label:'因为浏览器会自己猜结构，页面看起来正常，但结构已经被静默改变了——以后往里加内容时才会出问题',
       desc:'静默的错误最贵',
       correct:true,
       why:'浏览器的容错是好事也是陷阱：它让错误不显现，于是<b>你失去了发现它的机会</b>。<br><br>一个没闭合的标签会吞掉后面的内容；今天看起来没事，等你哪天往那段里加东西，样式就跑偏了——而那时候你根本想不到是几天前那个漏掉的闭合符号。<b>把检查放在错误发生的那一刻，比放在症状出现的那一刻便宜太多。</b>'},
      {label:'因为校验器的规则要尽量多，才显得完备', desc:'求全',
       why:'规则多不是目的。而且写一堆无意义的检查只会淹没真正重要的那几条——<b>校验器的价值在于信噪比</b>。'},
      {label:'因为浏览器在这个问题上表现不一致，换浏览器就出错', desc:'兼容性',
       why:'主流浏览器对这类容错的处理其实相当一致。问题不在兼容性，在于<b>错误被隐藏了</b>。'},
      {label:'因为这样能减少 HTML 文件体积', desc:'优化体积',
       why:'补一个闭合标签跟体积毫无关系。这是正确性和可维护性的问题。'}
    ],
    summary:'不报错不等于没错。被隐藏的错误最贵——它会在你最想不到的时候、以你最想不到的形式出现。'
  }
},

{
  id:'s3-1', ch:'第 3 章 · 写作规范里最要紧的',
  title:'零基础视角：先讲为什么，再讲怎么做',
  body:`
  <p>这一整套东西假设读者<b>在这个领域是零基础</b>。由此推出三条写法：</p>
  <ol>
    <li><b>先讲「为什么需要它」，再讲「它是什么」，最后才是「怎么做」。</b><br>
        直接讲怎么做，零基础读者会不知道自己正在记什么，也就记不住。</li>
    <li><b>每个专业名词第一次出现，就地解释。</b>不要假设读者知道任何缩写。</li>
    <li><b>用生活里的东西打比方，而且是他今天碰得到的东西。</b></li>
  </ol>
  <div class="callout c-key"><span class="lb">顺序错了，后面全白费</span>
  同一个知识点，「先讲为什么」和「先讲怎么做」的信息量是一样的，<b>但留存率差很多</b>。<br><br>
  因为「为什么」给了读者一个挂东西的钩子：知道要解决什么问题之后，「怎么做」才有地方可放。没有钩子，那些步骤就是一堆孤立的字符串，读完就散。</div>
  <div class="callout c-warn"><span class="lb">小心坑：不要写「众所周知」「显然」「简单来说」</span>
  对零基础读者来说，<b>没有什么是显然的</b>。<br><br>
  这三个词还有个副作用：读者看到它们却不懂时，会认为<b>是自己的问题</b>，然后不好意思往下问——于是卡在那里，或者直接放弃。<b>「简单来说」后面跟的那句话，往往正是最难的那一句。</b></div>
  <div class="callout c-tip"><span class="lb">小技巧：真的想简化，就直接给简化后的说法</span>
  不要写「简单来说，×××」。<b>直接把「×××」写出来就行</b>，前面那四个字删掉。这样你既省了字，也逼自己想清楚：我到底能不能把这件事说简单？</div>
  `,
  q:{ type:'quiz', text:'为什么规范里明确禁止写「众所周知」「显然」这类词？',
    opts:[
      {label:'因为对零基础读者来说没有什么是显然的；而且这类词会让读者在不懂时认为是自己的问题，从而不敢继续问',
       desc:'既是信息问题，也是心理问题',
       correct:true,
       why:'它有两层伤害。<b>信息层面</b>：这几个词不携带任何信息，只是把一句话垫长了。<b>心理层面</b>更麻烦——读者看到「众所周知」却不知道，第一反应是「我是不是太笨了」，而不是「作者没写清楚」。<br><br>结果是他在这一步停下，既不往下读也不提问。<b>你甚至不知道他卡在哪儿。</b>'},
      {label:'因为这类词显得太口语化，不够专业', desc:'文风问题',
       why:'这不是文风洁癖。禁令针对的是<b>它掩盖信息缺失</b>这个功能，不是它听起来够不够正式。'},
      {label:'因为它们会占用篇幅，让页面变长', desc:'篇幅',
       why:'这几个字占不了多少篇幅。如果只是嫌长，删掉即可，不必写成规范条款。'},
      {label:'因为零基础读者看不懂成语', desc:'词汇量',
       why:'「众所周知」「显然」都是很常见的词，读者当然看得懂——<b>问题恰恰在于看得懂</b>：他能理解这句话的意思，却学不到任何东西。'}
    ],
    summary:'「众所周知」不传递信息，还会让不懂的读者自责。要简化就直接给简化后的说法。'
  }
},

{
  id:'s3-2', ch:'第 3 章 · 写作规范里最要紧的',
  title:'事实纪律：算过才敢写，不确定就说不确定',
  body:`
  <p>这是整套规范里最硬的一条，也是最难执行的一条：</p>
  <div class="callout c-key"><span class="lb">任何数字、样例、判定条件，都要自己算过或跑过</span>
  涉及计算的，写个小程序验证；涉及多组样例的，逐组核对。<b>「看起来应该是对的」不算。</b></div>
  <p>举个真实例子。有一道题问「某两种尺寸的矩形能不能铺满另一个矩形」，它的判定条件是四个条件的组合。这个条件不是标准公式，需要自己推。</p>
  <p>做法不是「推一推觉得对了就写上去」，而是<b>写了一个精确覆盖的暴力铺砖程序</b>，在小范围内把所有尺寸组合都试一遍，和推出来的条件逐一比对——</p>
  <pre><code>共测 2197 组（面积可整除的），不一致 <span class="ok">0</span> 组
<span class="cm">// 范围：W,H ≤ 17，a,b ≤ 8</span></code></pre>
  <p>零不一致，才敢把那个条件写进正文。</p>
  <div class="callout c-warn"><span class="lb">推不出来的时候，规矩是「如实说不确定」，不是「编一个看起来合理的」</span>
  有一道题的最优实现涉及一个有争议的数据结构选择。写在页面里的做法是：<b>给出核心思路 + 一个能过部分分的写法，并明确标注「满分实现需要自己想清楚某某问题」。</b><br><br>
  这看起来像「没做完」，但它比编一个可能错的答案好得多：<b>读者照着错答案做，浪费的是他的时间；而写明不确定，他知道该自己验证哪里。</b></div>
  <div class="callout c-tip"><span class="lb">小技巧：把验证用的脚本一起存下来</span>
  验证过的东西会写在正文里，但验证本身的证据容易丢。惯例是开一个 <code>source/</code> 目录，把素材原文和一次性验证脚本都放进去。<br><br>它的价值在于：<b>半年后有人质疑这个数字，你能把脚本跑一遍给他看。</b></div>
  `,
  q:{ type:'quiz', text:'推导出一个结论但没把握，最该怎么做？',
    opts:[
      {label:'写进页面，但明确标注「这一步我没有验证，建议自己写个小程序对拍」',
       desc:'给出结论，同时给出不确定性',
       correct:true,
       why:'读者拿到的是「有这个方向 + 这里需要自己确认」，这是诚实且可用的信息。<br><br>关键区别在于：<b>他把不确定性也交出去了</b>。读者不会把它当成定论照抄，也就不会因为一个没验证的结论浪费时间。'},
      {label:'不写，等完全确定再说', desc:'宁缺毋滥',
       why:'这意味着那部分内容永远写不出来——很多东西短时间内就是验证不了的。而且<b>「这里有个我想不清楚的点」本身对读者就是有价值的信息</b>。'},
      {label:'写进去，但用比较肯定的语气，读起来更顺', desc:'保证可读性',
       why:'用肯定语气包装一个没把握的结论，是这套规范里最不能接受的做法——<b>它把风险转嫁给了没有能力判断的读者</b>。'},
      {label:'用模糊措辞暗示一下，比如「通常来说」「一般可以」', desc:'模糊表述',
       why:'模糊措辞不等于标注不确定性：读者读不出「作者其实没验证过」，只会觉得作者表达不干脆。<b>要标注就直接写清楚哪儿不确定。</b>'}
    ],
    summary:'给结论的同时把不确定性一起交出去，比给一个自信但可能有错的结论有用得多。'
  }
},

{
  id:'s3-3', ch:'第 3 章 · 写作规范里最要紧的',
  title:'红线：作业考试类内容，不给成品答案',
  body:`
  <p>有一条规矩跟「写得好不好」无关，但优先级最高：</p>
  <div class="callout c-warn"><span class="lb">面向作业 / 考试 / 竞赛类的内容，不给可以直接交差的成品答案或完整代码</span>
  给的是<b>思路、骨架、参数、坑</b>——把动手的部分留给读者。</div>
  <p>为什么这条是红线？两个理由，一个对自己，一个对读者：</p>
  <ol>
    <li><b>对读者：</b>拿到成品答案，学习就结束了。他不会再自己推一遍，也就不会真的学会。而他本来的目的就是学会。</li>
    <li><b>对自己：</b>这类材料常常要拿去验收、答辩、评审。<b>能跑通不等于讲得清。</b>一问「这里为什么这么设计」就露馅，比没有材料更糟。</li>
  </ol>
  <div class="callout c-key"><span class="lb">这条界线怎么划</span>
  看内容<b>是不是要拿去交差</b>：<br><br>
  <b>要交差的</b>（作业、免试题、竞赛题）→ 只给思路和坑，代码自己写。<br>
  <b>不用交差的</b>（装环境、配工具、通识概念）→ 可以给完整步骤，怎么省事怎么来。<br><br>
  同一份材料里这两种内容会混在一起，写的时候要分开对待。</div>
  <div class="callout c-tip"><span class="lb">小技巧：把「不给答案」变成「给验证方法」</span>
  不给答案不代表什么都不给。更有效的替代是<b>告诉读者怎么自己验证</b>：<br>
  「写个暴力版本对拍」「手算前三个小样例看规律对不对」「把中间变量打印出来对着算」<br><br>
  这样他仍然要自己动手，但不会漫无目的地卡住。<b>这是「帮他学会」和「替他做完」之间那条线。</b></div>
  `,
  q:{ type:'quiz', text:'按这条红线，下面哪种做法是允许的？',
    opts:[
      {label:'在讲一道作业题时，写出关键的数据结构选择和参数取值，但不给出完整实现',
       desc:'给脚手架，不给成品',
       correct:true,
       why:'这正好落在线的正确一侧：<b>读者仍然要自己写代码、自己调试、自己想清楚细节</b>，但他不会在方向上瞎撞。<br><br>而且这样产出的代码，他能讲清楚每一处为什么这么写——因为那些取舍是他自己做出来的。'},
      {label:'把完整可运行的代码贴上去，但在注释里写上「请自己理解后再交」', desc:'加了免责说明',
       why:'「请自己理解」这个动作在实践中几乎不会发生——<b>代码既然能跑，就没有动力去啃了</b>。而且验收时被追问实现细节，你仍然答不上来。'},
      {label:'只给最后答案的数字，不给过程', desc:'给答案不给过程',
       why:'这是最糟的一种：读者拿到了可以交差的答案，却什么也没学到，而你还要承担「直接给答案」的全部风险。'},
      {label:'把答案放在页面最后一节，让读者看不见', desc:'藏起来',
       why:'形式上藏了，实际上没给读者任何自己动手的抓手——他既没有方向，也没有验证方法。而且想抄的人往下翻两页就找到了。'}
    ],
    summary:'给思路、参数、验证方法，不给成品。这样读者既不会瞎撞，也得自己把它做出来。'
  }
},

{
  id:'s4-1', ch:'第 4 章 · 开始用',
  title:'三步上手',
  body:`
  <pre><code><span class="cm"># 1) 新建一个页面（工作区根目录下会多一个文件夹）</span>
node learning-pages/tools/new.js my-topic --brand "我的主题" --subtitle "零基础版"

<span class="cm"># 2) 编辑 my-topic/content.js —— 你唯一要写的文件</span>
<span class="cm">#    （不知道怎么写就先看 SPEC.md，或者参考 demo-skeleton）</span>

<span class="cm"># 3) 构建 + 校验</span>
node learning-pages/tools/build.js    my-topic
node learning-pages/tools/validate.js my-topic

<span class="cm"># 4) 打开看</span>
Start-Process my-topic\\index.html</code></pre>
  <p>需要的东西很少：<b>Node 就够了</b>，构建和校验都没有第三方依赖。只有从 PDF 提取文本时才需要 Python。</p>
  <div class="callout c-key"><span class="lb">推荐的工作顺序</span>
  <b>不要一口气写完 40 节再构建。</b><br><br>
  写完 3~5 节就构建一次、打开看一眼。内容格式的问题（少个括号、标签没闭合、id 打错）越早发现越便宜；写到 40 节再报错，你会在一堆错误里找不准位置。<br><br>
  另外，<b>先写第 0 章</b>（这是什么 + 怎么用 + 分诊题）。它是最省事的一章，却能立刻让你看到成品长什么样。</div>
  <div class="callout c-tip"><span class="lb">小技巧：拿 demo-skeleton 当模板</span>
  仓库里那个 3 节的最小示例，把五种卡片、两种题型、分诊跳转都演了一遍。<b>复制它、把内容换掉</b>，比对着文档凭空写快得多。</div>
  `,
  q:{ type:'quiz', text:'为什么建议「写 3~5 节就构建一次」，而不是全部写完再构建？',
    opts:[
      {label:'因为格式类错误越早发现越便宜——写到几十节再报错，会在一堆问题里找不准位置',
       desc:'缩短反馈回路',
       correct:true,
       why:'内容格式的错误（括号没配、<code>next</code> 指错、标签没闭合）在文本里很不起眼。写到 40 节时校验器可能一次报出十几个问题，<b>而它们分布在 2000 行里</b>。<br><br>写了 3 节就构建，报错只可能出自这 3 节——定位成本几乎是零。这条经验对所有「写结构化内容」的工作都成立。'},
      {label:'因为构建很慢，分批跑不占时间', desc:'性能考虑',
       why:'构建只要几百毫秒，慢不慢根本不是问题。真正常见的是反过来的情况——因为构建太快太容易，反而一直不构建，最后一口气报一堆错。'},
      {label:'因为写太多会超过文件大小限制', desc:'容量限制',
       why:'没有任何这种限制。这一页 20 节、含引擎和样式，构建出来也才 80 多 KB；写到 60 节也就两三百 KB。<b>体积从来不是约束，写作质量才是。</b>'},
      {label:'因为必须先看到效果才有动力继续写', desc:'心理激励',
       why:'这个好处确实存在，但不是主要理由。<b>不能依赖「靠看到效果来获得动力」——真正的理由应该是工程上的：反馈越短，定位越准。</b>'}
    ],
    summary:'结构化内容要短周期验证。错误越晚暴露，定位成本越高。'
  }

{
  id:'s4-2', ch:'第 4 章 · 开始用',
  title:'用 AI 帮你写内容',
  body:`
  <p>这套东西的设计前提之一是：<b>内容应该由 AI 大规模起草，由人来把关。</b></p>
  <p>做法是在工作区根目录放一份 <code>AGENTS.md</code>（仓库里有 <code>AGENTS.md.example</code> 模板）。支持自动加载指令文件的 agent——比如 DSH——每次会话都会读到它。</p>
  <div class="callout c-key"><span class="lb">装上之后，你只需要说一句话</span>
  「做一份关于 X 的学习页面」<br>
  「把这份 PDF 做成上次那种页面」<br><br>
  然后它会自动：读规范 → 提取素材 → 建页面 → 写 content.js → 构建 → 校验到零错误 → 打开。<b>不需要你再交代格式、卡片、出题规矩这些细节——它们都写在 SPEC.md 里了。</b></div>
  <p>关键在于 <code>SPEC.md</code> 里沉淀的<b>不只是数据格式</b>，还有前面三章讲的那些约定：术语怎么解释、错误选项怎么设计、数字必须算过、作业类不给成品答案。这些是「让一堆页面保持同一水准」的东西，也是最难靠临时提示词说清楚的东西。</p>
  <div class="callout c-warn"><span class="lb">小心坑：AI 起草的内容必须自己过一遍</span>
  它很擅长把结构搭对、把话说顺，<b>但事实性内容必须核对</b>——尤其是数字、判定条件、参数取值这类东西，错了你自己都不知道。<br><br>
  规范里那条「算过才敢写」是写给人的，也同样是写给 AI 的：<b>要么给出验证方式，要么标注不确定。</b></div>
  <div class="callout c-tip"><span class="lb">小技巧：让 AI 审自己写的内容</span>
  内容写完跑一次 <code>validate.js</code>，把提示贴回去让它改。比你自己一节一节读过去快得多——<b>尤其是「错误选项是不是真有人会这么想」这类判断，它给的意见往往比你自己想得全。</b></div>
  `,
  q:{ type:'quiz', text:'为什么把约定写进 <code>SPEC.md</code>，而不是每次让 AI 按你的提示词写？',
    opts:[
      {label:'因为格式和写作规矩需要长期保持一致，写进文件才能每次都生效；靠临时提示词会越写越走样',
       desc:'约定要沉淀，不能靠每次口述',
       correct:true,
       why:'提示词是一次性的，规范是可复用的。<b>你今天说「错误选项要是真实误解」，明天忘了说，出来的质量就掉一档</b>——而且你不会立刻发现，因为单看每一页都还行，问题在几十页的尺度上才显出来。<br><br>把约定写进文件还有第二层好处：<b>它变成了可以讨论和修改的东西</b>。下次觉得某条规矩不合适，改文件就行，不用每次重新交代。'},
      {label:'因为 AI 记不住长的提示词', desc:'上下文限制',
       why:'现代模型的上下文足够容纳一份规范。真正的问题不是「记不住」，是<b>「你每次都得说一遍，而且每次说得还不完全一样」</b>。'},
      {label:'因为写进文件能让 AI 运行更快', desc:'性能',
       why:'加载一份十几 KB 的规范对速度的影响可以忽略。这是「一致性」问题，不是「性能」问题。'},
      {label:'因为这样一来就不需要人来把关了', desc:'省人力',
       why:'恰恰相反——规范的存在让<b>把关更可行</b>：有了明确的标准，你才能快速判断某一段是不是达标。<b>没有标准的时候，人只能凭感觉，那才最累。</b>'}
    ],
    summary:'一次性的提示词换来一次性的质量。把约定沉淀进文件，才能让几十页保持同一水准。'
  }
},

{
  id:'s4-3', ch:'第 4 章 · 开始用',
  title:'术语速查表，以及接下来做什么',
  body:`
  <p>把这一页出现过的概念集中收一下，方便回头查。</p>
  <div class="callout c-term"><span class="lb">术语速查表</span>
  <div class="term">
    <b>内容源</b><span>你手写的那份文件（<code>content.js</code>），是唯一的真相来源。</span>
    <b>产物</b><span>构建出来的 <code>index.html</code>，随时可以重新生成，永远不要手改。</span>
    <b>单一真相来源</b><span>一件事只记在一个地方。就像只认一个账本。</span>
    <b>分诊</b><span>先问情况再决定起点，像医院里先分科。靠选项里的 <code>next</code> 实现。</span>
    <b>quiz / survey</b><span>前者有对错、选项会打乱；后者只是分诊或自评、顺序固定。</span>
    <b>术语卡</b><span>青色卡片。第一次出现的专业词，用生活比喻就地解释。</span>
    <b>卡片</b><span>五种视觉锚点。划重点每节最多一个。</span>
    <b>校验器</b><span>交付前的质检员。它真的把每一节、每个选项渲染一遍，不只看文字。</span>
    <b>静默错误</b><span>不报错、看起来正常、以后才发作的问题。最贵的那一类。</span>
    <b>确定性打乱</b><span>按 id 哈希打乱选项。位置分布均匀，但每次打开都一样。</span>
    <b>storageKey</b><span>本地进度存档的键。内容大改后要 +1，否则旧进度会错位。</span>
  </div></div>
  <div class="callout c-task"><span class="lb">动手任务：现在就做一页</span>
  <ol style="margin:0">
    <li>想一个你最近刚学会的小东西——越具体越好（比如「怎么用 Git 撤销一次提交」）。<b>不要选一个你还没学会的大主题。</b></li>
    <li>跑 <code>new.js</code> 建页面，先只写第 0 章（这是什么 + 怎么用 + 一道分诊题）。</li>
    <li>构建、打开、自己走一遍。<b>重点体会：你写的东西和最终呈现之间，隔了多少工作量。</b></li>
    <li>然后按「先讲为什么、再讲怎么做、最后配一道题」的节奏往下写 3 节。</li>
    <li>把校验器跑一遍，看它报了什么。第一次多半会报出你没注意到的问题。</li>
  </ol></div>
  <div class="callout c-key"><span class="lb">下一步看什么</span>
  真正动手写的时候，翻这两份就够了：<br>
  <b><code>SPEC.md</code></b> —— 内容格式 + 写作规范 + 红线，写的时候对着抄；<br>
  <b><code>demo-skeleton/</code></b> —— 3 节的最小示例，五种卡片全演了一遍。<br><br>
  剩下的（引擎怎么实现、工具怎么写）等你真的需要改它们的时候再看。</div>
  `,
  q:{ type:'survey', text:'走完了。接下来做什么？',
    opts:[
      {label:'马上去做一页自己的', desc:'最好的选择——半小时能见到成品', next:'s4-1'},
      {label:'回到第 2 章重看内容格式', desc:'准备动手前再看一遍', next:'s2-1'},
      {label:'去看看仓库里那份最小示例', desc:'对着它抄最快', next:'s2-2'},
      {label:'从头再快速过一遍', desc:'加深印象', next:'s0-1'}
    ],
    summary:'看会了不等于会做。先挑一个「你最近刚学会的小东西」，半小时就能走通全流程。'
  }
}

  ]
};

</script>
<script>
/* =========================================================================
   交互式学习页 · 通用引擎
   -------------------------------------------------------------------------
   本文件与内容无关。它只读 window.PAGE：
     PAGE.meta  = { brand, subtitle, docTitle, storageKey, extraCss }
     PAGE.steps = [ { id, ch, title, tag?, body, q? } ]
   题目规范见 learning-pages/SPEC.md，改内容请改 content.js，不要改这里。
   ========================================================================= */
(function () {
  'use strict';

  var PAGE  = window.PAGE || {};
  var STEPS = PAGE.steps || [];
  var META  = PAGE.meta  || {};
  var KEY   = META.storageKey || ('learning-page::' + (META.docTitle || 'untitled'));

  if (!STEPS.length) {
    document.getElementById('content').innerHTML =
      '<div class="wrap"><h2 class="title">这个页面还没有内容</h2>' +
      '<p>请检查 <code>content.js</code> 里的 <code>window.PAGE.steps</code> 是否为空，然后重新运行构建脚本。</p></div>';
    return;
  }

  var state = { idx: 0, answers: {} };

  /* ---------------- 选项顺序打乱（防"闭眼选第一个"） ----------------
     只对 quiz 生效；survey 是分诊/自评题，顺序本身有含义，必须保持原样。
     用步骤 id 做哈希，所以同一份内容每次构建、每次刷新，顺序都完全一致。
     想保留人工排序的题目，在该题里写 keepOrder:true 即可跳过。       */
  function hash32(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h >>> 0;
  }
  function rotateQuizOptions() {
    var rotated = 0;
    for (var i = 0; i < STEPS.length; i++) {
      var st = STEPS[i], q = st.q;
      if (!q || q.type !== 'quiz' || q.keepOrder) continue;
      var opts = q.opts;
      if (!opts || opts.length < 2) continue;
      var c = -1;
      for (var j = 0; j < opts.length; j++) if (opts[j].correct) { c = j; break; }
      if (c < 0) continue;
      var n = opts.length;
      var target = (hash32(st.id) + i) % n;
      var k = ((c - target) % n + n) % n;    // 循环左移 k 位后，正确项落到 target
      if (k === 0) continue;
      q.opts = opts.slice(k).concat(opts.slice(0, k));
      rotated++;
    }
    return rotated;
  }
  rotateQuizOptions();

  /* ---------------- 查询辅助 ---------------- */
  function stepIndex(id) {
    for (var i = 0; i < STEPS.length; i++) if (STEPS[i].id === id) return i;
    return -1;
  }
  function answerOf(st) { return state.answers[st.id]; }
  function isDone(st)   { return state.answers[st.id] !== undefined; }
  function isQuiz(st)   { return !!(st.q && st.q.type === 'quiz'); }
  function score() {
    var ok = 0, tot = 0;
    for (var i = 0; i < STEPS.length; i++) {
      var st = STEPS[i];
      if (!isQuiz(st)) continue;
      tot++;
      var a = answerOf(st);
      if (a !== undefined && st.q.opts[a] && st.q.opts[a].correct) ok++;
    }
    return { ok: ok, tot: tot };
  }

  /* ---------------- 存档 ---------------- */
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p.idx === 'number') state = p;
      }
    } catch (e) {}
    if (state.idx == null || state.idx < 0 || state.idx >= STEPS.length) state.idx = 0;
    if (!state.answers) state.answers = {};
  }

  /* ---------------- 侧栏 ---------------- */
  function renderNav() {
    var nav = document.getElementById('nav');
    var html = '', lastCh = null, i, st, cls;
    for (i = 0; i < STEPS.length; i++) {
      st = STEPS[i];
      if (st.ch !== lastCh) {
        html += '<div class="grp">' + (st.ch || '') + '</div>';
        lastCh = st.ch;
      }
      cls = ['', isDone(st) ? 'done' : '', i === state.idx ? 'cur' : ''].filter(Boolean).join(' ');
      html += '<a class="' + cls + '" onclick="LP.jump(' + i + ')">' +
              '<span class="dot">' + (isDone(st) ? '✓' : '') + '</span>' +
              '<span>' + (st.title || '') + '</span></a>';
    }
    nav.innerHTML = html;

    var total = STEPS.length, done = 0;
    for (i = 0; i < STEPS.length; i++) if (isDone(STEPS[i])) done++;
    var pct = Math.round(done * 100 / total);
    document.getElementById('pbar').style.width = pct + '%';
    document.getElementById('ptxt').textContent = '进度 ' + pct + '%';
    var sc = score();
    document.getElementById('ptot').textContent = done + '/' + total + ' 节 · 答对 ' + sc.ok + '/' + sc.tot;
  }

  /* ---------------- 正文 ---------------- */
  function render() {
    var st = STEPS[state.idx];
    if (!st) return;
    var sel = answerOf(st);
    var answered = sel !== undefined;

    var html = '<div class="wrap">';
    html += '<div class="crumb">' + (st.ch || '') + '</div>';
    html += '<h2 class="title">' + (st.title || '') +
            (st.tag ? '<span class="tag">' + st.tag + '</span>' : '') + '</h2>';
    html += '<div class="body">' + (st.body || '') + '</div>';

    if (st.q) {
      var q = st.q, isSurvey = q.type === 'survey';
      html += '<div class="quiz"><div class="qh">' +
              '<span class="tag' + (isSurvey ? ' sv' : '') + '">' + (isSurvey ? '选一选' : '想一想') + '</span>' +
              '<span class="qt">' + q.text + '</span></div><div class="opts">';

      for (var i = 0; i < q.opts.length; i++) {
        var o = q.opts[i], cls = ['opt'];
        if (answered) {
          cls.push('lock', 'answered');
          if (i === sel) cls.push(isSurvey ? 'reveal' : (o.correct ? 'sel-ok' : 'sel-bad'));
          else if (!isSurvey && o.correct) cls.push('reveal');
        }
        html += '<div class="' + cls.join(' ') + '" onclick="LP.choose(' + i + ')">';
        html += '<span class="num">' + (i + 1) + '</span><span class="tx">';
        html += '<span class="lb">' + o.label + '</span>';
        if (o.desc) html += '<span class="ds">' + o.desc + '</span>';
        if (answered && o.why) html += '<span class="why">' + o.why + '</span>';
        html += '</span></div>';
      }
      html += '</div>';

      if (answered) {
        if (isSurvey) {
          html += '<div class="verdict info on"><span class="lb">说明</span>' + (q.summary || '') + '</div>';
        } else if (q.opts[sel] && q.opts[sel].correct) {
          html += '<div class="verdict good on"><span class="lb">✓ 答对了</span>' + (q.summary || '') + '</div>';
        } else {
          html += '<div class="verdict bad on"><span class="lb">✗ 再看看绿色那条</span>' + (q.summary || '') +
                  '<br>点击「重答本题」可以再试一次。</div>';
        }
      }

      html += '<div class="qfoot">';
      if (answered) html += '<button class="tiny ghost" onclick="LP.redo()">重答本题</button>';
      html += '<span class="hint">' +
              (answered ? '看懂了就继续 →'
                        : '按数字键 <kbd>1</kbd>~<kbd>' + q.opts.length + '</kbd> 也可以选') +
              '</span></div></div>';
    }

    html += '</div>';
    var c = document.getElementById('content');
    c.innerHTML = html;
    c.scrollTop = 0;

    document.getElementById('crumbTop').textContent =
      (st.ch || '') + '  ·  ' + (state.idx + 1) + ' / ' + STEPS.length;
    document.getElementById('btnPrev').disabled = state.idx === 0;

    var isLast = state.idx === STEPS.length - 1;
    var nx = (answered && st.q && st.q.opts[sel]) ? st.q.opts[sel].next : null;
    document.getElementById('btnNext').textContent =
      isLast ? '完成 ✓' : (nx ? '继续 →' : '下一题 →');

    renderNav();
    save();
  }

  /* ---------------- 交互 ---------------- */
  function choose(i) {
    var st = STEPS[state.idx];
    if (!st.q || answerOf(st) !== undefined) return;
    state.answers[st.id] = i;
    render();
  }
  function redo() {
    delete state.answers[STEPS[state.idx].id];
    render();
  }
  function jump(i) {
    if (i < 0 || i >= STEPS.length) return;
    state.idx = i;
    var side = document.getElementById('side');
    if (side) side.classList.remove('open');
    render();
  }
  function go(dir) {
    var st = STEPS[state.idx];
    var sel = answerOf(st);
    if (dir > 0 && st.q && sel !== undefined && st.q.opts[sel]) {
      var nx = st.q.opts[sel].next;
      if (nx !== undefined) {
        var t = stepIndex(nx);
        if (t >= 0) { state.idx = t; render(); return; }
      }
    }
    var n = state.idx + dir;
    if (n < 0) n = 0;
    if (n >= STEPS.length) n = STEPS.length - 1;
    state.idx = n;
    render();
  }
  function resetAll() {
    if (!window.confirm('确定要清空所有进度重新开始吗？')) return;
    state = { idx: 0, answers: {} };
    save();
    render();
  }
  function toggleMenu() {
    var side = document.getElementById('side');
    if (side) side.classList.toggle('open');
  }

  /* ---------------- 启动 ---------------- */
  document.addEventListener('keydown', function (e) {
    var st = STEPS[state.idx];
    if (!st) return;
    if (e.key >= '1' && e.key <= '9') {
      var i = parseInt(e.key, 10) - 1;
      if (st.q && i < st.q.opts.length) { choose(i); e.preventDefault(); }
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'Enter') { go(1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
  });

  window.LP = {
    choose: choose, redo: redo, jump: jump, go: go,
    resetAll: resetAll, toggleMenu: toggleMenu,
    render: render,
    state: state,
    steps: STEPS,
    meta: META,
    _score: score
  };

  load();
  render();
})();

</script>
</body>
</html>
